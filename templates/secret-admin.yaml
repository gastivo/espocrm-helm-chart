{{- if not .Values.admin.existingSecret }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "espocrm.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "espocrm.adminSecretName" . }}
  labels:
    {{- include "espocrm.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.admin.password | default (randAlphaNum 24) | b64enc | quote }}
{{- end }}
