apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "espocrm.fullname" . }}-bootstrap
  labels:
    {{- include "espocrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20" # run after configmaps and secrets (weight -50) but before the main deployment (weight 0)
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        {{- include "espocrm.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-bootstrap
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "/bin/bash", "/usr/local/bin/ha-bootstrap.sh" ]
          envFrom:
            - configMapRef:
                name: {{ include "espocrm.fullname" . }}-env
            {{- include "espocrm.extraEnvFrom" . | nindent 12 }}
          env:
            - name: ESPOCRM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "espocrm.adminSecretName" . }}
                  key: {{ include "espocrm.adminSecretKey" . }}
            - name: ESPOCRM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "espocrm.databaseSecretName" . }}
                  key: {{ .Values.externalDatabase.secretKey | quote }}
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: espocrm-misc
              mountPath: /var/www/html/data/config-override.php
              subPath: config-override.php
            - name: espocrm-misc
              mountPath: /var/www/html/data/config-override-internal.php
              subPath: config-override-internal.php
            - name: espocrm-data
              mountPath: /var/www/html/data
              subPath: data
            - name: espocrm-data
              mountPath: /var/www/html/custom
              subPath: custom
            - name: espocrm-data
              mountPath: /var/www/html/client/custom
              subPath: client-custom
            - name: espocrm-misc
              mountPath: /usr/local/bin/ha-bootstrap.sh
              subPath: ha-bootstrap.sh
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: espocrm-misc
          configMap:
            name: {{ include "espocrm.fullname" . }}-misc
            defaultMode: 0755
        - name: espocrm-data
          persistentVolumeClaim:
            claimName: {{ include "espocrm.dataClaimName" . }}
        {{- with .Values.extraVolumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
