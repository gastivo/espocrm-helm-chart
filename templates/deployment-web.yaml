apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "espocrm.fullname" . }}-web
  labels:
    {{- include "espocrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "espocrm.selectorLabelsWeb" . | nindent 6 }}
  template:
    metadata:
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
        {{- with .Values.web.podAnnotations | default .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "espocrm.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.web.podLabels | default .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: {{ .Chart.Name }}-bootstrap
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "/bin/bash", "/usr/local/bin/ha-bootstrap.sh" ]
          envFrom:
            - configMapRef:
                name: {{ include "espocrm.fullname" . }}-env
            {{- include "espocrm.extraEnvFrom" . | nindent 12 }}
          env:
            - name: HELM_RELEASE_REVISION
              value: {{ include "espocrm.bootstrapID" . | quote }}
            - name: ESPOCRM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "espocrm.adminSecretName" . }}
                  key: {{ include "espocrm.adminSecretKey" . }}
            - name: ESPOCRM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "espocrm.databaseSecretName" . }}
                  key: {{ .Values.externalDatabase.secretKey | quote }}
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts:
            {{- include "espocrm.commonVolumeMounts" . | nindent 12 }}
            - name: espocrm-misc
              mountPath: /usr/local/bin/ha-bootstrap.sh
              subPath: ha-bootstrap.sh
              readOnly: true
            {{- if .Values.bootstrap.php_ini }}
            - name: espocrm-misc
              mountPath: /usr/local/etc/php/conf.d/zzz-custom.ini
              subPath: bootstrap-php.ini
              readOnly: true
            {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "/bin/bash", "/usr/local/bin/ha-entrypoint.sh" ]
          args: [ "docker-entrypoint.sh", "apache2-foreground" ]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.available }}
            - name: metrics
              containerPort: 9100
              protocol: TCP
            {{- end }}
          {{- with .Values.web.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            {{- include "espocrm.commonVolumeMounts" . | nindent 12 }}
            - name: espocrm-misc
              mountPath: /etc/apache2/sites-enabled/000-default.conf
              subPath: 000-default.conf
              readOnly: true
            {{- if .Values.metrics.available }}
            - name: espocrm-misc
              mountPath: /etc/apache2/sites-enabled/001-metrics.conf
              subPath: 001-metrics.conf
              readOnly: true
            {{- end }}
            {{- if .Values.web.php_ini }}
            - name: espocrm-misc
              mountPath: /usr/local/etc/php/conf.d/zz-custom.ini
              subPath: web-php.ini
              readOnly: true
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "espocrm.fullname" . }}-env
            {{- include "espocrm.extraEnvFrom" . | nindent 12 }}
          env:
            - name: ESPOCRM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "espocrm.adminSecretName" . }}
                  key: {{ include "espocrm.adminSecretKey" . }}
            - name: ESPOCRM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "espocrm.databaseSecretName" . }}
                  key: {{ .Values.externalDatabase.secretKey | quote }}
            {{- with .Values.extraEnvVars }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "espocrm.commonVolumes" . | nindent 8 }}
      {{- with .Values.web.nodeSelector | default .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := include "espocrm.affinity" (dict "component" "web" "componentValues" .Values.web "context" .) | trim }}
      {{- if $affinity }}
      affinity:
        {{- $affinity | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
