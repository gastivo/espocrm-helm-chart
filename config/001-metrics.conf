Listen 9100
<VirtualHost *:9100>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    SetEnvIf User-Agent "kube-probe" dontlog
    CustomLog /proc/self/fd/1 json env=!dontlog

    RewriteEngine On
    # / redirects to /metrics
    RewriteRule ^/$ /metrics [R=302,L]
    # /metrics redirects to /api/v1/metrics
    RewriteRule ^/metrics$ /api/v1/metrics [R=302,L]
    # Block everything except /, /metrics and /api/v1/metrics
    # Use THE_REQUEST to check original request (not affected by internal rewrites)
    RewriteCond "%{THE_REQUEST}" "!^GET / "
    RewriteCond "%{THE_REQUEST}" "!^GET /metrics "
    RewriteCond "%{THE_REQUEST}" "!^GET /api/v1/metrics "
    RewriteCond "%{THE_REQUEST}" "!^GET /api/v1/metrics\?"
    RewriteRule .* - [F,L]

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
