nameOverride: ""
fullnameOverride: ""

image:
  repository: docker.io/espocrm/espocrm
  tag: 9.3.10

logging:
  level: DEBUG # DEBUG,NOTICE,WARNING,INFO,ERROR,CRITICAL

ingress:
  enabled: false
  # className: nginx
  # hosts:
  #   - espocrm.example.com
  #   - espocrm-alias.example.com
  # tls:
  #   - hosts:
  #       - espocrm.example.com
  #     secretName: espocrm-tls
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

admin:
  username: "admin"
  password: ""
  existingSecret: "" # If you want to use an existing Kubernetes Secret for the admin password
  existingKey: "admin-password" # The key in the existing secret that contains the admin password

config:
  # Inline PHP config overrides – rendered into a ConfigMap and mounted automatically.
  # Each value must be a valid PHP file that returns an array, e.g.:
  #   configOverride: |
  #     <?php
  #     return ['siteUrl' => 'https://crm.example.com'];
  configOverride: ""
  configInternalOverride: ""
  # Use an existing ConfigMap instead of the inline values above.
  # The ConfigMap must contain the keys 'config-override.php' and/or
  # 'config-internal-override.php'. When set, configOverride and
  # configInternalOverride are ignored and no ConfigMap is rendered by this chart.
  existingConfigMap: ""

bootstrap:
  # path where bootstrap can find .zip files to install extensions
  extensionsPath: ""
  # Number of retries before the Job is considered failed
  backoffLimit: 3
  # PHP INI overrides for the bootstrap Job container (e.g. raise memory limit for large installations)
  php_ini: |
    memory_limit=-1
  # Resource requests/limits for the bootstrap Job container
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 800m
      memory: 1Gi

daemon:
  replicaCount: 1
  terminationGracePeriodSeconds: 30
  affinity:
    # -- Default pod anti-affinity preset. Either: `none`, `soft` or `hard`
    podAntiAffinity: none
    # -- Custom affinity rules (overrides podAntiAffinity preset when set)
    # custom: {}
  # nodeSelector: {}
  # tolerations: []
  # podAnnotations: {}
  # podLabels: {}
  # php_ini: |
  #   memory_limit=512M
  #  resources:
  #    requests:
  #      cpu: 300m
  #      memory: 512Mi
  #    limits:
  #      cpu: 800m
  #      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
    # metrics: []        # Fully overrides the generated metrics block (HPA v2 metrics array)
    # behavior: {}       # Fully overrides the behavior block (scaleUp/scaleDown policies)

web:
  replicaCount: 1
  affinity:
    # -- Default pod anti-affinity preset. Either: `none`, `soft` or `hard`
    podAntiAffinity: soft
    # -- Custom affinity rules (overrides podAntiAffinity preset when set)
    # custom: {}
  # nodeSelector: {}
  # tolerations: []
  # podAnnotations: {}
  # podLabels: {}
  service:
    type: ClusterIP
  # php_ini: |
  #   memory_limit=256M
  #  resources:
  #    requests:
  #      cpu: 300m
  #      memory: 512Mi
  #    limits:
  #      cpu: 800m
  #      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 10
    initialDelaySeconds: 10
    timeoutSeconds: 10
    periodSeconds: 5
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
    # metrics: []        # Fully overrides the generated metrics block (HPA v2 metrics array)
    # behavior: {}       # Fully overrides the behavior block (scaleUp/scaleDown policies)

websocket:
  enabled: false
  replicaCount: 1
  terminationGracePeriodSeconds: 10
  affinity:
    # -- Default pod anti-affinity preset. Either: `none`, `soft` or `hard`
    podAntiAffinity: soft
    # -- Custom affinity rules (overrides podAntiAffinity preset when set)
    # custom: {}
  # nodeSelector: {}
  # tolerations: []
  # podAnnotations: {}
  # podLabels: {}
  service:
    type: ClusterIP
  # php_ini: |
  #   memory_limit=256M
  #  resources:
  #    requests:
  #      cpu: 300m
  #      memory: 512Mi
  #    limits:
  #      cpu: 800m
  #      memory: 1Gi
  livenessProbe:
    tcpSocket:
      port: websocket
    initialDelaySeconds: 0
    timeoutSeconds: 5
    periodSeconds: 15
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: websocket
    initialDelaySeconds: 0
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 3
  startupProbe:
    tcpSocket:
      port: websocket
    initialDelaySeconds: 5
    failureThreshold: 12
    timeoutSeconds: 5
    periodSeconds: 5
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
    # metrics: []        # Fully overrides the generated metrics block (HPA v2 metrics array)
    # behavior: {}       # Fully overrides the behavior block (scaleUp/scaleDown policies)

persistence:
  size: 1Gi
  # accessModes defines the PVC access modes.
  # Use ReadWriteMany for production (NFS / cloud RWX storage).
  # Use ReadWriteOnce for local dev clusters (hostpath / local-path provisioner).
  accessModes:
    - ReadWriteMany
  # storageClass: ""
  # existingClaim: ""
  # annotations: {}

# Extra environment variables to add to the ConfigMap.
# Example:
# extraEnv:
#   ESPOCRM_LANGUAGE: "de_DE"
#   ESPOCRM_DEFAULT_CURRENCY: "EUR"
#   ESPOCRM_THOUSAND_SEPARATOR: "."
extraEnv: { }

# Name of an existing Secrets or ConfigMaps to pull additional environment variables from.
# The secret must exist before the chart is deployed.
extraEnvFrom:
  secretRef: []
  configMapRef: []

externalDatabase:
  platform: Postgresql # Mysql or Postgresql
  host: "postgresql.postgresql.svc.cluster.local"
  port: 5432
  user: ""
  password: ""
  database: ""
  existingSecret: ""
  secretKey: "db-password"

# Extra volume mounts added to ALL pods (web, daemon, websocket, bootstrap init-container).
extraVolumeMounts: [ ]

# Extra volumes added to ALL pods (web, daemon, websocket, bootstrap init-container).
# Must match the names referenced in extraVolumeMounts above.
extraVolumes: [ ]

# Pod-level security context. fsGroup: 33 ensures all mounted PVC volumes
# are group-owned by www-data so Apache workers can write to them.
podSecurityContext:
  fsGroup: 33  # www-data

# Container-level security context. Containers must run as root (uid 0)
# because docker-entrypoint.sh calls chown inside setPermissions().
securityContext: { }

# enable this only if you have a metrics Extension installed!
metrics:
  available: false
  serviceMonitor:
    enabled: false
    path: "/api/v1/metrics"
    annotations: { }
    interval: 30s
    scrapeTimeout: 10s
    relabelings: [ ]
