apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "espocrm.fullname" . }}-daemon
  labels:
    {{- include "espocrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.daemon.replicaCount }}
  selector:
    matchLabels:
      {{- include "espocrm.selectorLabelsDaemon" . | nindent 6 }}
  template:
    metadata:
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
        {{- with .Values.daemon.podAnnotations | default .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "espocrm.labels" . | nindent 8 }}
        app.kubernetes.io/component: daemon
        {{- with .Values.daemon.podLabels | default .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.daemon.terminationGracePeriodSeconds | default 30 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: {{ .Chart.Name }}-wait-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HELM_RELEASE_REVISION
              value: {{ include "espocrm.bootstrapID" . | quote }}
          command: [ "/bin/bash", "/usr/local/bin/ha-wait-bootstrap.sh" ]
          volumeMounts:
            - name: espocrm-misc
              mountPath: /usr/local/bin/ha-wait-bootstrap.sh
              subPath: ha-wait-bootstrap.sh
              readOnly: true
            - name: espocrm-data
              mountPath: /var/www/html/data
              subPath: data
      containers:
        - name: {{ .Chart.Name }}-daemon
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "/bin/bash", "/usr/local/bin/ha-entrypoint.sh" ]
          args: [ "ha-daemon.sh" ]
          lifecycle:
            preStop:
              exec:
                # php daemon.php runs as a child of the shell (not exec'd), so it never
                # receives SIGTERM from Kubernetes. Kill it explicitly so the pod stops fast.
                command: [ "/bin/sh", "-c", "pkill -TERM -f 'php.*daemon' 2>/dev/null; sleep 2" ]
          envFrom:
            - configMapRef:
                name: {{ include "espocrm.fullname" . }}-env
            {{- include "espocrm.extraEnvFrom" . | nindent 12 }}
          env:
            - name: ESPOCRM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "espocrm.adminSecretName" . }}
                  key: {{ include "espocrm.adminSecretKey" . }}
            - name: ESPOCRM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "espocrm.databaseSecretName" . }}
                  key: {{ .Values.externalDatabase.secretKey | quote }}
            - name: ESPOCRM_DAEMON_MODE
              value: "true"
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          volumeMounts:
            {{- include "espocrm.commonVolumeMounts" . | nindent 12 }}
            - name: espocrm-misc
              mountPath: /usr/local/bin/ha-daemon.sh
              subPath: ha-daemon.sh
              readOnly: true
            {{- if .Values.daemon.php_ini }}
            - name: espocrm-misc
              mountPath: /usr/local/etc/php/conf.d/zz-custom.ini
              subPath: daemon-php.ini
              readOnly: true
            {{- end }}
      volumes:
        {{- include "espocrm.commonVolumes" . | nindent 8 }}
      {{- with .Values.daemon.nodeSelector | default .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := include "espocrm.affinity" (dict "component" "daemon" "componentValues" .Values.daemon "context" .) | trim }}
      {{- if $affinity }}
      affinity:
        {{- $affinity | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
