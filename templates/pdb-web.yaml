{{- if .Values.web.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "espocrm.fullname" . }}-web
  labels:
    {{- include "espocrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if .Values.web.pdb.minAvailable }}
  minAvailable: {{ .Values.web.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.web.pdb.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "espocrm.selectorLabelsWeb" . | nindent 6 }}
{{- end }}
