---
{{- if .Values.metrics.available }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "espocrm.fullname" . }}-metrics
spec:
  type: ClusterIP
  ports:
    - port: 9100
      targetPort: 9100
      protocol: TCP
      name: metrics
  selector:
    {{- include "espocrm.selectorLabelsWeb" . | nindent 4 }}
{{- end }}
