{{- if and .Values.websocket.enabled .Values.websocket.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "espocrm.fullname" . }}-websocket
  labels:
    {{- include "espocrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: websocket
spec:
  {{- if .Values.websocket.pdb.minAvailable }}
  minAvailable: {{ .Values.websocket.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.websocket.pdb.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "espocrm.selectorLabelsWebsocket" . | nindent 6 }}
{{- end }}
