{{- if .Values.websocket.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "espocrm.fullname" . }}-websocket
  labels:
    {{- include "espocrm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.websocket.service.type }}
  ports:
    - port: 8080
      targetPort: websocket
      protocol: TCP
      name: websocket
  selector:
    {{- include "espocrm.selectorLabelsWebsocket" . | nindent 4 }}
{{- end }}
